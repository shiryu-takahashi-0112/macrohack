name: Claude Review and Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  claude-review-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            このプルリクエストの差分をレビューしてください。以下の観点で確認してください:
            - コード品質とベストプラクティス
            - バグや潜在的な不具合
            - セキュリティ上の懸念
            - パフォーマンスへの影響

            PRブランチは既にチェックアウト済みです。
            気づいた点は `gh pr comment` を使ってPRにコメントしてください。

            マージをブロックすべき重大な問題(バグ・セキュリティ問題・重大な設計上の欠陥)が
            なければ approved を true にしてください。軽微な指摘のみの場合も true としてください。
            重大な問題がある場合は approved を false にし、summary に具体的な理由を記載してください。
          claude_args: |
            --allowedTools "Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","properties":{"approved":{"type":"boolean"},"summary":{"type":"string"}},"required":["approved","summary"]}'

      - name: Auto-merge PR (no blocking issues found)
        if: fromJSON(steps.claude-review.outputs.structured_output).approved == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --auto --squash

      - name: Notify when changes are requested
        if: fromJSON(steps.claude-review.outputs.structured_output).approved == false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "🤖 Claude のレビューでマージをブロックする問題が見つかったため、自動マージをスキップしました。上記のレビューコメントを確認してください。"
